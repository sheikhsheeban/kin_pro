# Questions for the Kin recall benchmark. All asked on Mon 5 Oct 2026 at 09:00, after the week in week.txt.
#
#   id        unique id; the prefix is the category
#   cat       single_fact | lookup | time_scoped | latest_version | who_said | multi_fact | split |
#             abstain | real_failure
#   q         what the user asks (clean: the query STT is the larger model)
#   expect    rule check: a list of groups; each group is a list of alternatives (or one string).
#             A group matches if any alternative appears in the spoken answer (case-insensitive,
#             number words -> digits, "1,850" -> "1850", "Saffron2026" -> "saffron 2026").
#             Alternatives ending in a letter also match as a prefix ("promot" matches "promoted").
#   min       how many groups must match (default: all)
#   forbid    phrases that make the answer wrong if spoken
#   support   ids of the line(s) in week.txt that hold the answer (retrieval recall@5 uses these)
#   abstain   true: the right answer is "I don't remember" (nothing in the week answers it)
#   accept_abstain  true: abstaining also counts as correct (the honest answer is partial)
#   smoke     true: part of the 20-question smoke subset that runs in normal pytest
#   answer    the reference answer in words (for the optional Gemma judge and for humans)

